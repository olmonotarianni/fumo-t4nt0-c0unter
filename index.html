<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>counteer</title>
<style>
  :root {
    --bg: #f6f5f1; --fg: #1c1c1a; --muted: #77776e; --card: #fff; --line: #e1e0d8;
    --p1: #b4482e; --p1-soft: #f6e4de; --p2: #1f6f78; --p2-soft: #dcecee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --fg: #ecebe5; --muted: #8b8b82; --card: #1d1d1b; --line: #2e2e2b;
      --p1: #e0775b; --p1-soft: #2b1b16; --p2: #5db5bf; --p2-soft: #14262a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 14px 48px; background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, sans-serif; display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 720px; }
  .arena { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .arena { grid-template-columns: 1fr 1fr; } }

  .side { --c: var(--p1); --soft: var(--p1-soft); background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 16px; padding: 14px 16px 16px; }
  .side.p2 { --c: var(--p2); --soft: var(--p2-soft); }
  .side.lead { background: var(--soft); }

  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .side.p2 .head { flex-direction: row-reverse; }
  .side.p2 .name { text-align: right; }
  .char { font-size: 72px; line-height: 1; flex: none; }
  .name { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; padding: 2px 0; font: inherit; font-size: 20px; font-weight: 600; color: var(--c); }

  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px 12px; text-align: left; color: inherit; font: inherit; cursor: pointer; touch-action: manipulation; }
  .btn:active { background: var(--c); border-color: var(--c); color: #fff; }
  .btn .t { display: block; font-size: 13px; opacity: .7; }
  .btn .c { display: block; font-size: 40px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }

  .undo { display: block; margin: 16px auto 0; width: 100%; max-width: 280px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; font-size: 15px; cursor: pointer; }
  .undo:disabled { opacity: .35; cursor: default; }
  .undo .sub { font-size: 12px; opacity: .7; }

  .log { margin-top: 24px; }
  .log h2 { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  .log ul { list-style: none; margin: 0; padding: 0; }
  .log li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.p1 { background: var(--p1); } .dot.p2 { background: var(--p2); }
  .who { flex: 1; }
  .when { color: var(--muted); font-variant-numeric: tabular-nums; }

  .xp { display: none; position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 10; width: min(300px, 86vw);
    background: #ece9d8; border: 2px solid #0831d9; border-radius: 8px 8px 0 0; box-shadow: 4px 4px 0 rgba(0,0,0,.35); font: 14px Tahoma, Verdana, sans-serif; color: #000; }
  .xp.on { display: block; }
  .xp .bar { background: linear-gradient(#3a7bf0, #0a4fd8); color: #fff; font-weight: 700; padding: 4px 6px 4px 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 6px 6px 0 0; }
  .xp .x { background: #d9532c; color: #fff; border: 1px solid #fff; border-radius: 3px; width: 22px; height: 22px; font-weight: 700; line-height: 1; cursor: pointer; }
  .xp .msg { display: flex; align-items: center; gap: 12px; padding: 18px 14px; }
  .xp .ico { font-size: 30px; }
  .xp .ok { display: block; margin: 0 auto 14px; min-width: 80px; padding: 4px 12px; background: #f4f3ee; border: 1px solid #003c74; border-radius: 3px; font: inherit; color: #000; cursor: pointer; }
  .status { text-align: center; color: var(--muted); font-size: 12px; margin: 10px 0 0; min-height: 16px; }
  .more { display: block; margin: 10px auto 0; background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; }
  .tag { margin: 36px 0 0 auto; width: max-content; max-width: 70%; transform: rotate(-3deg); font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); opacity: .55; letter-spacing: .04em; text-align: right; text-shadow: 1px 1px 0 var(--line); user-select: none; }

  .dash { margin-top: 28px; }
  .dash h2 { font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .legend .it { display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .sw.p1 { background: var(--p1); } .sw.p2 { background: var(--p2); }
  .sw.full { background: var(--fg); } .sw.light { background: var(--fg); opacity: .35; }
  .chart { display: flex; }
  .day { flex: 1; min-width: 0; padding: 0 3px; }
  .pair { height: 124px; display: flex; align-items: flex-end; justify-content: center; gap: 4px; border-bottom: 1px solid var(--line); }
  .col { width: 100%; max-width: 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .col .tv { font-size: 11px; color: var(--muted); line-height: 1.6; font-variant-numeric: tabular-nums; }
  .stack { width: 100%; display: flex; flex-direction: column-reverse; gap: 2px; }
  .seg { width: 100%; }
  .seg.top { border-radius: 4px 4px 0 0; }
  .p1 .seg { background: var(--p1); } .p2 .seg { background: var(--p2); }
  .seg.b { opacity: .4; }
  .col.sel .stack { outline: 1px solid var(--fg); outline-offset: 2px; border-radius: 4px 4px 0 0; }
  .dl { text-align: center; font-size: 11px; color: var(--muted); margin-top: 6px; white-space: nowrap; }
  .dinfo { min-height: 18px; font-size: 13px; color: var(--fg); margin: 10px 0 0; text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <div class="arena">

    <section class="side p1" id="side-p1">
      <div class="head">
        <span class="char" aria-hidden="true">🐉</span>
        <input class="name" id="name-p1" maxlength="20" aria-label="Nome giocatore 1">
      </div>
      <div class="btns" id="btns-p1"></div>
    </section>

    <section class="side p2" id="side-p2">
      <div class="head">
        <span class="char" aria-hidden="true">🦉</span>
        <input class="name" id="name-p2" maxlength="20" aria-label="Nome giocatore 2">
      </div>
      <div class="btns" id="btns-p2"></div>
    </section>
  </div>

  <button class="undo" id="undo">↶ annulla ultima<br><span class="sub">(solo per misclick eh)</span></button>
  <p class="status" id="status"></p>

  <section class="log">
    <h2>Registro</h2>
    <ul id="log"></ul>
    <button class="more" id="more" hidden></button>
  </section>

  <section class="dash" id="dash" hidden>
    <h2>Giorno per giorno</h2>
    <div class="legend">
      <span class="it"><i class="sw p1"></i><span id="lg-p1"></span></span>
      <span class="it"><i class="sw p2"></i><span id="lg-p2"></span></span>
      <span class="it"><i class="sw full"></i>A</span>
      <span class="it"><i class="sw light"></i>B</span>
    </div>
    <div class="chart" id="chart"></div>
    <p class="dinfo" id="dinfo"></p>
  </section>
  <p class="tag">Ⓐ LA CONTA dall'ora zero eh!<br>dal 23/11 alle 23:30 eh!<br><span id="elapsed"></span></p>
</main>

<div class="xp" id="xp" role="alertdialog">
  <div class="bar"><span>Attenzione</span><button class="x" id="xp-x" aria-label="Chiudi">×</button></div>
  <div class="msg"><span class="ico">⚠️</span><span id="xp-msg"></span></div>
  <button class="ok" id="xp-ok">OK</button>
</div>
<script>
const PLAYERS = {
  p1: { cats: ["A", "B"], defaultName: "samoht" },
  p2: { cats: ["A", "B"], defaultName: "olmio" },
};
// Ogni registrazione ora porta con sé il giocatore: { p: "p1", c: "A", t: ... }
// I vecchi dati (solo lettera) vengono convertiti: A,C -> p1 (A,B); B,D -> p2 (A,B).
const LEGACY = { A: ["p1", "A"], C: ["p1", "B"], B: ["p2", "A"], D: ["p2", "B"] };
const normalize = es => es.map(e => e.p ? e : { p: LEGACY[e.c]?.[0], c: LEGACY[e.c]?.[1], t: e.t }).filter(e => e.p);
const EVENTS_KEY = "contatore-sigarette-v1";
const NAMES_KEY  = "contatore-sigarette-nomi-v1";

// Livello dati: per la versione condivisa si sostituiscono solo queste due funzioni.
function load(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }

let events = normalize(load(EVENTS_KEY, []));
let names  = load(NAMES_KEY, {});
const nameOf = pid => names[pid] || PLAYERS[pid].defaultName;


const POPUPS = ["ahi ahi", "se non bestemmio guarda"];
const POPUP_CHANCE = 0.15;
const xp = document.getElementById("xp");
const closeXp = () => xp.classList.remove("on");
document.getElementById("xp-ok").onclick = closeXp;
document.getElementById("xp-x").onclick = closeXp;
function maybePopup() {
  if (Math.random() >= POPUP_CHANCE) return;
  document.getElementById("xp-msg").textContent = POPUPS[Math.floor(Math.random() * POPUPS.length)];
  xp.classList.add("on");
}

const countEls = {};   // chiave: "p1A", "p2B", ...
for (const [pid, p] of Object.entries(PLAYERS)) {
  const box = document.getElementById("btns-" + pid);
  for (const cat of p.cats) {
    const b = document.createElement("button");
    b.className = "btn";
    b.innerHTML = `<span class="t">Sigarette ${cat}</span><span class="c">0</span>`;
    b.onclick = () => { addEvent(pid, cat); maybePopup(); };
    box.appendChild(b);
    countEls[pid + cat] = b.querySelector(".c");
  }
  const input = document.getElementById("name-" + pid);
  input.value = nameOf(pid);
  input.oninput = () => { names[pid] = input.value.trim() || p.defaultName; save(NAMES_KEY, names); renderLog(); renderDash(); };
}
document.getElementById("undo").onclick = undoEvent;
document.getElementById("more").onclick = () => { showAll = !showAll; renderLog(); };


// ---- Sincronizzazione condivisa (Firebase Realtime Database, via REST) ----
// Incolla qui l'indirizzo del database, senza "/" finale. Esempio:
// https://nome-progetto-default-rtdb.europe-west1.firebasedatabase.app
const DB_URL = "https://counteer-3fc6b-default-rtdb.europe-west1.firebasedatabase.app";

let chain = Promise.resolve();
const statusEl = document.getElementById("status");
function setStatus(ok, err) {
  if (!DB_URL) { statusEl.textContent = "Archivio condiviso non configurato: i dati sono solo su questo dispositivo"; return; }
  statusEl.textContent = ok ? "Sincronizzato" : "Offline (" + (err && /^http/.test(err.message) ? "errore " + err.message.slice(5) : "richiesta bloccata o rete assente") + "): i dati sono solo su questo dispositivo";
}
async function api(path, opts) {
  const r = await fetch(DB_URL + path, opts);
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}
async function pull() {
  const d = await api("/events.json", { cache: "no-store" });
  const list = Object.entries(d || {}).sort(([a], [b]) => a < b ? -1 : a > b ? 1 : 0).map(([id, v]) => ({ ...v, id }));
  const next = normalize(list);
  if (JSON.stringify(next) !== JSON.stringify(events)) { events = next; save(EVENTS_KEY, events); render(); }
}
function remote(task) {
  if (!DB_URL) { setStatus(false); return; }
  chain = chain.then(async () => {
    try { await task(); await pull(); setStatus(true); } catch (e) { setStatus(false, e); }
  });
}

function addEvent(p, c) {
  const ev = { p, c, t: Date.now() };
  events = [...events, ev]; save(EVENTS_KEY, events); render();
  remote(() => api("/events.json", { method: "POST", body: JSON.stringify(ev) }));
}
function undoEvent() {
  if (!events.length) return;
  events = events.slice(0, -1); save(EVENTS_KEY, events); render();
  remote(async () => {
    const d = await api('/events.json?orderBy="$key"&limitToLast=1');
    const key = Object.keys(d || {})[0];
    if (key) await api("/events/" + key + ".json", { method: "DELETE" });
  });
}

setInterval(() => { if (!document.hidden) remote(() => Promise.resolve()); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) remote(() => Promise.resolve()); });

const pad = n => String(n).padStart(2, "0");
function fmt(t) {
  const d = new Date(t);
  return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

let dashSel = null;   // { k: "2026-11-25", p: "p1" }
function renderDash() {
  const box = document.getElementById("dash");
  if (!events.length) { box.hidden = true; return; }
  box.hidden = false;
  document.getElementById("lg-p1").textContent = nameOf("p1");
  document.getElementById("lg-p2").textContent = nameOf("p2");

  const key = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const first = new Date(Math.min(...events.map(e => e.t))); first.setHours(0, 0, 0, 0);
  let start = new Date(today); start.setDate(start.getDate() - 6);
  if (first > start) start = first;
  const days = [];
  for (const d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) days.push(new Date(d));

  const data = {};
  for (const d of days) data[key(d)] = { p1: { A: 0, B: 0 }, p2: { A: 0, B: 0 } };
  for (const e of events) { const k = key(new Date(e.t)); if (data[k]) data[k][e.p][e.c]++; }
  const tot = v => v.A + v.B;
  const max = Math.max(1, ...days.flatMap(d => ["p1", "p2"].map(p => tot(data[key(d)][p]))));
  const unit = 96 / max;   // px per sigaretta

  const label = d => d.toDateString() === today.toDateString() ? "oggi" : d.toLocaleDateString("it-IT", { weekday: "short" }) + " " + d.getDate();
  const chart = document.getElementById("chart");
  chart.innerHTML = "";
  for (const d of days) {
    const k = key(d), day = document.createElement("div");
    day.className = "day";
    let cols = "";
    for (const p of ["p1", "p2"]) {
      const v = data[k][p], t = tot(v);
      const seg = (n, cls, top) => n ? `<div class="seg ${cls}${top ? " top" : ""}" style="height:${Math.max(3, Math.round(n * unit))}px"></div>` : "";
      cols += `<div class="col ${p}${dashSel && dashSel.k === k && dashSel.p === p ? " sel" : ""}" data-k="${k}" data-p="${p}">` +
        `<span class="tv">${t || ""}</span><div class="stack">${seg(v.A, "a", !v.B)}${seg(v.B, "b", true)}</div></div>`;
    }
    day.innerHTML = `<div class="pair">${cols}</div><div class="dl">${label(d)}</div>`;
    chart.appendChild(day);
  }
  chart.onclick = ev => {
    const c = ev.target.closest(".col");
    if (!c) return;
    dashSel = { k: c.dataset.k, p: c.dataset.p };
    renderDash();
  };
  const info = document.getElementById("dinfo");
  if (dashSel && data[dashSel.k]) {
    const v = data[dashSel.k][dashSel.p], [y, m, dd] = dashSel.k.split("-");
    info.textContent = `${nameOf(dashSel.p)} · ${dd}/${m}: A ${v.A} · B ${v.B} · totale ${tot(v)}`;
  } else info.textContent = "";
}

let showAll = false;
function renderLog() {
  const more = document.getElementById("more");
  more.hidden = events.length <= 8;
  more.textContent = showAll ? "Mostra solo le ultime 8" : "Mostra tutto (" + events.length + ")";
  const log = document.getElementById("log");
  log.innerHTML = "";
  for (const e of (showAll ? events : events.slice(-8)).slice().reverse()) {
    const pid = e.p;
    const li = document.createElement("li");
    li.innerHTML = `<span class="dot ${pid}"></span><span class="who"></span><span class="when">${fmt(e.t)}</span>`;
    li.querySelector(".who").textContent = `${nameOf(pid)} · ${e.c}`;
    log.appendChild(li);
  }
}

function render() {
  const cat = { p1A: 0, p1B: 0, p2A: 0, p2B: 0 }, tot = { p1: 0, p2: 0 };
  for (const e of events) { cat[e.p + e.c]++; tot[e.p]++; }
  for (const c in cat) countEls[c].textContent = cat[c];
  document.getElementById("undo").disabled = events.length === 0;
  document.getElementById("side-p1").classList.toggle("lead", events.length > 0 && tot.p1 < tot.p2);
  document.getElementById("side-p2").classList.toggle("lead", events.length > 0 && tot.p2 < tot.p1);
  renderLog();
  renderDash();
}
const ZERO = new Date(2026, 10, 23, 23, 30);   // ora zero: 23/11/2026 alle 23:30
function renderElapsed() {
  const h = Math.floor((Date.now() - ZERO) / 3600000);
  if (h < 0) { document.getElementById("elapsed").textContent = ""; return; }
  const d = Math.floor(h / 24), hh = h % 24;
  document.getElementById("elapsed").textContent =
    `passati ${d} ${d === 1 ? "giorno" : "giorni"} e ${hh} ${hh === 1 ? "ora" : "ore"} eh!`;
}
renderElapsed();
setInterval(renderElapsed, 60000);

render();
setStatus(true);
remote(() => Promise.resolve());
</script>
</body>
</html>
